<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0800">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Man Card">
<title>The Man Card</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230A0800'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' font-family='Georgia,serif' font-weight='bold' fill='%23FFD700'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Pinyon+Script&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0800; --bg-mid:#111005; --card1:#150d00; --card2:#0A0800;
    --border:#3a2a00; --border-bright:#7B5A00;
    --gold:#FFD700; --gold-mid:#C9A84C; --gold-dim:#8B6914;
    --text:#E8D5A3; --text-dim:#9A7A3A; --text-faint:#5A3A00;
    --red:#7B0000; --red-bright:#C0392B;
    --font-d:'Cinzel',serif; --font-b:'Crimson Pro',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg);}
  body{
    font-family:var(--font-b); color:var(--text); min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, #1a1000 0%, transparent 55%),
      var(--bg);
    padding-bottom:78px;
  }
  #app{max-width:560px; margin:0 auto; padding:18px 16px 24px;}
  h1,h2,h3,.disp{font-family:var(--font-d); letter-spacing:1.5px;}
  a{color:var(--gold-mid);}
  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px;}
  :focus-visible{outline:2px solid var(--gold-mid); outline-offset:2px;}

  /* ---------- brand header ---------- */
  .brand{text-align:center; padding:6px 0 16px;}
  .brand-row{display:flex; align-items:center; justify-content:center; gap:14px;}
  .brand-row{align-items:flex-end; gap:6px;}
  .flank{height:150px; width:auto; max-width:30vw; object-fit:contain; flex:none;}
  .brand-title{flex:1; min-width:0; padding-bottom:18px;}
  .brand-title h1{font-size:clamp(16px,5vw,24px); line-height:1.15;}
  .mirror-x{transform:scaleX(-1);}
  .card-hero{position:relative;}
  .hero-flank-row{display:flex; align-items:flex-end; justify-content:space-between; gap:4px;}
  .hero-flank-row .hero-center{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; text-align:center;}
  .flank-mini{height:118px; width:auto; max-width:22%; object-fit:contain; flex:none; opacity:.95;}
  .brand h1{font-size:20px; margin:0; text-transform:uppercase; color:var(--gold); font-weight:700;}
  .brand .tag{font-size:10.5px; letter-spacing:3px; text-transform:uppercase; color:var(--text-dim); margin-top:4px;}
  .hero-figure{text-align:center; margin:4px 0 18px;}
  .hero-figure img{max-width:230px; width:70%; height:auto; filter:drop-shadow(0 10px 20px #00000090);}
  .hero-figure .cap{font-size:10.5px; letter-spacing:2.5px; text-transform:uppercase; color:var(--text-faint); margin-top:8px;}
  .flourish{display:flex; align-items:center; gap:10px; margin:18px 0 14px; color:var(--border-bright);}
  .flourish::before,.flourish::after{content:''; flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--border-bright),transparent);}
  .flourish span{font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--gold-dim); white-space:nowrap;}

  /* ---------- cards / surfaces ---------- */
  .card{
    background:linear-gradient(160deg,var(--card1),var(--card2));
    border:1px solid var(--border-bright); border-radius:6px;
    padding:18px 16px; margin-bottom:14px;
    box-shadow:0 0 0 1px #000, 0 4px 24px #00000080, inset 0 1px 0 #ffffff08;
    position:relative;
  }
  .card.quiet{border-color:var(--border);}
  .muted{color:var(--text-dim); font-size:13px;}
  .faint{color:var(--text-faint);}

  /* ---------- buttons ---------- */
  button{font-family:var(--font-b); cursor:pointer;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    width:100%; border-radius:4px; padding:13px 18px; font-size:12.5px;
    font-weight:700; letter-spacing:2px; text-transform:uppercase;
    font-family:var(--font-d); border:1px solid #7B4A00; margin-top:4px;
    transition:filter .15s, transform .05s;
  }
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:.4; cursor:default;}
  .btn:hover:not(:disabled){filter:brightness(1.12);}
  .btn-gold{background:linear-gradient(135deg,#7B4A00,var(--gold-mid),#7B4A00); color:#0A0800;}
  .btn-outline{background:transparent; border-color:var(--border-bright); color:var(--text-dim);}
  .btn-danger{background:linear-gradient(135deg,var(--red),var(--red-bright)); border-color:var(--red-bright); color:#fff;}
  .btn-sm{width:auto; padding:8px 14px; font-size:11px;}
  .btn-row{display:flex; gap:8px;}
  .btn-row .btn{flex:1;}
  .linklike{background:none; border:none; color:var(--gold-mid); font-family:var(--font-b); font-size:13px; text-decoration:underline; padding:4px;}

  /* ---------- inputs ---------- */
  label.field-label{display:block; color:var(--gold-mid); font-size:10.5px; letter-spacing:2.5px; text-transform:uppercase; margin:14px 0 6px; font-family:var(--font-d);}
  input[type=text],input[type=date],textarea,select{
    width:100%; background:#080600; border:1px solid var(--border-bright); color:var(--text);
    padding:11px 12px; border-radius:4px; font-size:15px; font-family:var(--font-b); outline:none;
  }
  textarea{min-height:88px; resize:vertical;}
  input::placeholder, textarea::placeholder{color:var(--text-faint);}
  input:focus,textarea:focus,select:focus{border-color:var(--gold-mid);}
  select option{background:#0A0800; color:var(--text);}

  /* ---------- pillar / tier pickers ---------- */
  .pick-row{display:flex; gap:8px; margin-bottom:4px;}
  .pick-chip{
    flex:1; text-align:center; border:1px solid var(--border-bright); border-radius:4px;
    padding:10px 6px; font-size:11.5px; letter-spacing:1px; text-transform:uppercase;
    color:var(--text-dim); background:#0d0900; font-family:var(--font-d); font-weight:600;
  }
  .pick-chip.active{background:linear-gradient(135deg,#3a2a00,#5a3f00); color:var(--gold); border-color:var(--gold-mid);}
  .tier-opt{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    border:1px solid var(--border); border-left-width:4px; border-radius:4px;
    padding:11px 12px; margin-bottom:8px; background:#0d0900; cursor:pointer;
  }
  .tier-opt.active{background:#171000; border-color:var(--gold-mid); border-left-color:inherit;}
  .tier-opt .t-name{font-family:var(--font-d); font-size:13px; font-weight:600;}
  .tier-opt .t-desc{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .tier-opt .t-range{font-size:13px; font-weight:700; white-space:nowrap;}

  /* ---------- tabs ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    display:flex; justify-content:space-around;
    background:#0A0800ee; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    border-top:1px solid var(--border); padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
  }
  .tab{background:none; border:none; color:var(--text-faint); display:flex; flex-direction:column; align-items:center; gap:2px; font-size:9.5px; letter-spacing:1px; text-transform:uppercase; font-family:var(--font-d); padding:4px 8px; flex:1;}
  .tab .ic{font-size:19px; line-height:1;}
  .tab.active{color:var(--gold);}

  /* ---------- feed entries ---------- */
  .entry{display:flex; gap:11px;}
  .avatar{
    width:38px; height:38px; min-width:38px; border-radius:50%; overflow:hidden; position:relative;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-d); font-weight:700; font-size:15px; color:#E9C866;
    background:radial-gradient(circle at 50% 35%, #1a1409, #050403 75%);
    box-shadow:0 0 0 1px #b8902e, 0 0 0 2.5px #000, 0 0 0 3.2px #6e5418;
  }
  .avatar img{width:100%; height:100%; object-fit:cover; display:block;}
  .avatar.lg{width:88px; height:88px; min-width:88px; font-size:34px; box-shadow:0 0 0 1.5px #c9a84c, 0 0 0 4px #000, 0 0 0 5px #6e5418, 0 6px 18px rgba(0,0,0,.7);}
  button.avatar{border:0; padding:0; cursor:pointer; font:inherit; font-family:var(--font-d); font-weight:700; font-size:34px;}
  .avatar-edit{position:absolute; left:0; right:0; bottom:0; padding:3px 0 5px; font-family:'Crimson Pro',serif; font-style:italic; font-weight:500;
    font-size:11px; letter-spacing:0; color:#f0d27a; background:linear-gradient(transparent, rgba(0,0,0,.85) 55%);}
  .portrait-veil{position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.88); display:flex; align-items:center; justify-content:center; padding:24px;}
  .portrait-box{width:min(340px,100%); text-align:center; padding:26px 22px 22px; border-radius:16px; background:#070605;
    box-shadow:0 0 0 1.5px #b8902e, 0 0 0 4px #000, 0 0 0 5px #6e5418, 0 30px 60px #000;}
  .portrait-box h3{font-family:'Pinyon Script',cursive; font-weight:400; font-size:44px; line-height:1; margin:0 0 14px; color:#EACB6E;}
  .portrait-box .pv{width:200px; height:200px; margin:0 auto 14px; border-radius:50%; overflow:hidden; box-shadow:0 0 0 1.5px #c9a84c, 0 0 0 5px #000, 0 0 0 6px #6e5418;}
  .portrait-box .pv img{width:100%; height:100%; display:block;}
  .portrait-box p{font-family:'Crimson Pro',serif; font-style:italic; color:#9c8445; margin:0 0 16px; font-size:14px;}
  .portrait-box .row{display:flex; gap:10px;} .portrait-box .row .btn{flex:1;}
  .entry-body{flex:1; min-width:0;}
  .entry-top{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .entry-name{font-weight:700; color:var(--text); font-size:14px;}
  .entry-time{font-size:10.5px; color:var(--text-faint); white-space:nowrap;}
  .chip-row{display:flex; gap:6px; margin:5px 0 8px; flex-wrap:wrap;}
  .chip{font-size:10px; letter-spacing:1px; text-transform:uppercase; padding:3px 8px; border-radius:20px; border:1px solid; font-family:var(--font-d); font-weight:600;}
  .verdict-text{font-size:14px; line-height:1.5; font-style:italic; color:var(--text);}
  .score-tag{font-family:var(--font-d); font-weight:800; font-size:16px; margin-left:8px; white-space:nowrap;}
  .react-row{display:flex; align-items:center; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .react-pill{background:#0d0900; border:1px solid var(--border); border-radius:20px; padding:4px 9px; font-size:12.5px; color:var(--text-dim); display:inline-flex; gap:4px; align-items:center;}
  .react-pill.mine{border-color:var(--gold-dim); color:var(--gold-mid);}
  .react-add{background:none; border:1px dashed var(--border-bright); color:var(--text-faint); border-radius:20px; width:26px; height:26px; font-size:14px; line-height:1;}
  .react-popover{display:flex; gap:6px; background:#150d00; border:1px solid var(--border-bright); border-radius:20px; padding:6px 8px; margin-top:8px; flex-wrap:wrap;}
  .react-popover button{background:none; border:none; font-size:19px; padding:2px;}

  /* ---------- roster ---------- */
  .roster-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);}
  .roster-row:last-child{border-bottom:none;}
  .roster-name{font-weight:700; font-size:14.5px;}
  .roster-rank{font-size:11.5px; color:var(--text-dim);}
  .roster-score{margin-left:auto; font-family:var(--font-d); font-weight:700; color:var(--gold-mid); font-size:14px;}

  /* ---------- card / profile ---------- */
  .card-hero{text-align:center; padding:8px 0 4px;}
  .card-hero .rank-icon{font-size:44px; display:block; margin-bottom:6px; color:var(--gold);}
  .card-hero .rank-title{font-size:17px; color:var(--gold); text-transform:uppercase; font-weight:700;}
  .card-hero .bracket{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim); margin-top:2px;}
  .card-hero .score-big{font-family:var(--font-d); font-size:38px; color:var(--gold); margin:10px 0 2px;}
  .progress{height:6px; background:#1a1000; border-radius:3px; overflow:hidden; border:1px solid var(--border);}
  .progress > div{height:100%; background:linear-gradient(90deg,var(--gold-dim),var(--gold-mid));}
  .stat-grid{display:flex; gap:10px; margin-top:14px;}
  .stat-box{flex:1; text-align:center; background:#0d0900; border:1px solid var(--border); border-radius:5px; padding:10px 4px;}
  .stat-box .n{font-family:var(--font-d); font-size:19px; color:var(--gold-mid); font-weight:700;}
  .stat-box .l{font-size:9.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-faint); margin-top:2px;}
  .badge-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px;}
  .badge-item{display:flex; align-items:center; gap:9px; border:1px solid var(--border); border-radius:5px; padding:9px; background:#0d0900;}
  .badge-item.earned{border-color:var(--gold-dim); background:#171000;}
  .badge-item .em{font-size:21px; filter:grayscale(1); opacity:.35;}
  .badge-item.earned .em{filter:none; opacity:1;}
  .badge-item .bn{font-size:11.5px; font-weight:700; color:var(--text-dim);}
  .badge-item.earned .bn{color:var(--gold);}
  .badge-item .bd{font-size:9.5px; color:var(--text-faint); margin-top:1px;}

  /* ---------- verdict reveal overlay ---------- */
  .veil{position:fixed; inset:0; background:#000000e6; z-index:60; display:flex; align-items:center; justify-content:center; padding:24px;}
  .seal{
    width:64px; height:64px; border-radius:50%; margin:0 auto 14px;
    border:2px solid var(--gold-mid); display:flex; align-items:center; justify-content:center;
    font-size:28px; animation:spin 1.1s linear infinite; color:var(--gold);
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .verdict-card{max-width:380px; text-align:center; animation:fadeUp .35s ease;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(14px);}to{opacity:1; transform:translateY(0);}}
  .verdict-score{font-family:var(--font-d); font-size:52px; font-weight:800; margin:8px 0;}
  .burst-particle{position:fixed; top:40vh; z-index:70; pointer-events:none; animation:burst 1.1s ease-out forwards;}
  @keyframes burst{0%{transform:translateY(0) scale(0.6); opacity:1;}100%{transform:translateY(-90px) scale(1.3); opacity:0;}}
  .toast{position:fixed; left:50%; top:14px; transform:translateX(-50%); background:#171000; border:1px solid var(--gold-dim); color:var(--gold-mid); padding:9px 16px; border-radius:20px; font-size:12.5px; z-index:80; box-shadow:0 4px 20px #000000aa;}

  .manifesto p{line-height:1.7; font-size:14.5px;}
  .manifesto .pillar-name{color:var(--gold); font-weight:700; font-family:var(--font-d); letter-spacing:1px;}
  .tagline{text-align:center; font-family:var(--font-d); color:var(--gold); letter-spacing:3px; font-size:12.5px; text-transform:uppercase; margin-top:22px;}

  .status-bar{text-align:center; font-size:11.5px; color:var(--text-faint); padding:4px 0 10px;}
  .empty{text-align:center; color:var(--text-faint); font-size:13.5px; padding:30px 10px;}


  /* ---------- COVER: the card itself ---------- */
  .cover-stage{position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    padding:max(12px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
    background:radial-gradient(120% 80% at 50% 30%, #17120a 0%, #050403 60%, #000 100%); perspective:1400px;}
  .mcard{position:relative; display:flex; flex-direction:column; align-items:center; border:0; cursor:pointer; color:inherit; font:inherit;
    width:min(92vw, 480px, calc((100dvh - 64px) * .72)); height:min(calc(100dvh - 64px), calc(min(92vw,480px) * 2.1));
    container-type:size; padding:9cqh 7cqw 4.5cqh; border-radius:18px;
    background:
      radial-gradient(90% 45% at 50% 30%, rgba(255,215,120,.075), transparent 70%),
      linear-gradient(160deg, #0d0b08 0%, #030303 45%, #0a0806 100%);
    box-shadow:0 0 0 1.5px #b8902e, 0 0 0 3px #000, 0 0 0 4px #6e5418, 0 30px 60px rgba(0,0,0,.8), 0 0 80px rgba(201,168,76,.10);
    transform-origin:left center; transition:transform .75s cubic-bezier(.6,.05,.3,1), opacity .75s ease; overflow:hidden;}
  .mcard:focus-visible{outline:2px solid #FFD700; outline-offset:6px;}
  .mcard::before{content:''; position:absolute; inset:10px; border:1px solid rgba(201,168,76,.55); border-radius:11px; pointer-events:none;}
  .mcard::after{content:''; position:absolute; inset:15px; border:.5px solid rgba(201,168,76,.28); border-radius:8px; pointer-events:none;}
  .mcard .corner{position:absolute; width:46px; height:46px; color:#c9a84c; pointer-events:none;}
  .mcard .corner.tl{top:6px; left:6px;} .mcard .corner.tr{top:6px; right:6px; transform:scaleX(-1);}
  .mcard .corner.bl{bottom:6px; left:6px; transform:scaleY(-1);} .mcard .corner.br{bottom:6px; right:6px; transform:scale(-1,-1);}
  .mcard .the{margin-top:auto; font-family:'Cinzel',serif; font-weight:600; font-size:4cqw; letter-spacing:.55em; padding-left:.55em; color:#c9a84c;}
  .mcard .title{text-align:center; font-family:'Pinyon Script',cursive; font-weight:400; font-size:min(33cqw, 17cqh); line-height:.95; margin:1cqh 0 auto;
    background:linear-gradient(180deg,#fff1b8 0%,#f1cf6a 38%,#a8801f 58%,#e9c460 78%,#fff0b0 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:1.6px #e2bd5c; filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 14px rgba(255,200,90,.22));}
  .mcard .title span{display:block;}
  .mcard .title span + span{margin-top:-.08em; padding-left:.35em;}
  .mcard .figs{flex:none; height:44cqh; width:108%; display:flex; align-items:flex-end; justify-content:space-between; gap:0; pointer-events:none;}
  .mcard .figs img{display:block; min-width:0; max-height:100%; object-fit:contain; object-position:bottom; filter:drop-shadow(0 0 6px rgba(0,0,0,.9));}
  .mcard .figs .fb{width:62%;}
  .mcard .figs .fg{width:40%; transform:scaleX(-1);}
  .mcard .rule{width:72%; height:1px; flex:none; margin-top:2.5cqh; background:linear-gradient(90deg,transparent,#c9a84c,transparent);}
  .mcard .holder{max-width:100%; margin-top:2cqh; font-family:'Cinzel',serif; font-weight:700; font-size:min(6.2cqw,3.2cqh); letter-spacing:.14em;
    color:#f0d27a; text-shadow:0 1px 0 #000, 0 -1px 0 rgba(255,240,190,.25); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mcard .holder.unclaimed{color:#8a7338; font-weight:500; letter-spacing:.2em;}
  .mcard .motto{margin-top:.8cqh; font-family:'Crimson Pro',serif; font-style:italic; font-size:min(4cqw,2.2cqh); color:#8a7338;}
  .cover-hint{font-family:'Crimson Pro',serif; font-style:italic; font-size:15px; color:#9c8445; animation:hintPulse 2.4s ease-in-out infinite;}
  @keyframes hintPulse{0%,100%{opacity:.45}50%{opacity:1}}
  .cover-stage.opening .mcard{transform:rotateY(-105deg); opacity:.0;}
  .cover-stage.opening .cover-hint{opacity:0; animation:none;}
  .cover-stage.opening{transition:background .75s ease;}
  @keyframes appIn{from{opacity:0; transform:scale(.985)} to{opacity:1; transform:none}}
  #app.app-in{animation:appIn .45s ease-out;}
  @media (prefers-reduced-motion: reduce){ .mcard{transition:opacity .2s ease;} .cover-stage.opening .mcard{transform:none;} .cover-hint{animation:none; opacity:.8;} #app.app-in{animation:none;} }
  @media (prefers-reduced-motion: reduce){ .seal,.burst-particle,.verdict-card{animation:none;} }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";

  /* =========================================================
     ARTWORK — vintage boxer + gentleman, embedded as WebP data

  /* The engraving: brightness drives the width of fine diagonal gold
     lines (a classic banknote line screen), and dark contour cuts from
     an edge pass keep the features readable. Everything runs on the
     phone; only the finished 160px image is uploaded. */
  var AV_SIZE = 160;
  function engraveImage(img){
    var S = AV_SIZE, W = S*2;
    var c = document.createElement('canvas'); c.width = W; c.height = W;
    var x = c.getContext('2d');
    var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    var side = Math.min(iw, ih);
    var sx = (iw - side)/2, sy = Math.max(0, (ih - side)/2 - (ih > iw ? (ih-side)*0.15 : 0)); // portrait photos: bias up toward the face
    x.fillStyle = '#000'; x.fillRect(0,0,W,W);
    x.drawImage(img, sx, sy, side, side, 0, 0, W, W);
    var d = x.getImageData(0,0,W,W).data, N = W*W, L = new Float32Array(N), i;
    for(i=0;i<N;i++){ L[i] = (0.299*d[i*4] + 0.587*d[i*4+1] + 0.114*d[i*4+2]) / 255; }
    // auto-level (2nd..98th percentile)
    var hist = new Uint32Array(256); for(i=0;i<N;i++) hist[Math.min(255,(L[i]*255)|0)]++;
    var lo=0, hi=255, acc=0; for(i=0;i<256;i++){ acc+=hist[i]; if(acc>N*0.02){ lo=i; break; } }
    acc=0; for(i=255;i>=0;i--){ acc+=hist[i]; if(acc>N*0.02){ hi=i; break; } }
    var span = Math.max(20, hi-lo)/255, base = lo/255;
    for(i=0;i<N;i++){ var v=(L[i]-base)/span; v = v<0?0:(v>1?1:v); L[i] = v; }
    // soft tone (box blur r=2) for the line widths
    function blur(src, r){
      var tmp = new Float32Array(N), out = new Float32Array(N), xx, yy, k, sum, n;
      for(yy=0;yy<W;yy++){ for(xx=0;xx<W;xx++){ sum=0;n=0; for(k=-r;k<=r;k++){ var q=xx+k; if(q>=0&&q<W){ sum+=src[yy*W+q]; n++; } } tmp[yy*W+xx]=sum/n; } }
      for(yy=0;yy<W;yy++){ for(xx=0;xx<W;xx++){ sum=0;n=0; for(k=-r;k<=r;k++){ var q2=yy+k; if(q2>=0&&q2<W){ sum+=tmp[q2*W+xx]; n++; } } out[yy*W+xx]=sum/n; } }
      return out;
    }
    // local contrast (unsharp mask) so eyes, brows and jaw read at thumbnail size
    var B = blur(L, 10);
    for(i=0;i<N;i++){ var q = L[i] + (L[i]-B[i])*1.1; L[i] = q<0?0:(q>1?1:q); }
    var T = blur(L, 1), E = blur(L, 1);
    var o = x.createImageData(W, W), od = o.data;
    var period = 4.4, ca = Math.cos(-0.785), sa = Math.sin(-0.785);
    for(var yy=0; yy<W; yy++){

        i = yy*W+xx;
        // edge strength (sobel on lightly blurred luminance)
        var gx=0, gy=0;
        if(xx>0 && yy>0 && xx<W-1 && yy<W-1){
          gx = -E[i-W-1]-2*E[i-1]-E[i+W-1] + E[i-W+1]+2*E[i+1]+E[i+W+1];
          gy = -E[i-W-1]-2*E[i-W]-E[i-W+1] + E[i+W-1]+2*E[i+W]+E[i+W+1];
        }
        var edge = Math.min(1, Math.sqrt(gx*gx+gy*gy) * 1.6);
        // line screen: the line gets fatter where the photo is brighter,
        // with a gentle wobble so it reads as hand-cut rather than printed
        var u = (xx*ca - yy*sa) / period + 0.18*Math.sin(yy*0.045 + xx*0.02);
        var f = Math.abs(u - Math.floor(u) - 0.5) * 2;       // 0 at line centre, 1 between lines
        // cameo vignette: the background falls away into the black card
        var dx = xx/W - 0.5, dy = yy/W - 0.46, rr = Math.sqrt(dx*dx+dy*dy) / 0.5;

        od[i*4+2] = g * (148 - 98*ty);

    render();

  function avatarColor(name){
    var h=0; for(var i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) % AVATAR_COLORS.length; }
    return AVATAR_COLORS[Math.abs(h)];
  }
  function avatarHtml(name, size, editable){
    var cls = size==='lg' ? 'avatar lg' : 'avatar';
    var pic = portraitFor(name);

  function findPerson(name){ for(var i=0;i<shared.people.length;i++){ if(shared.people[i].name===name) return shared.people[i]; } return null; }
  function clampScore(s){ return Math.max(0, Math.min(MAX_SCORE, s)); }

  /* =========================================================
     THE COUNCIL — deterministic judge (see note in chat re:
     why this isn't a live LLM call in a public static file)
     ========================================================= */
  function randRange(min,max){ return Math.round(min + Math.random()*(max-min)); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function detectBadge(text, alreadyEarned){
    var low = String(text).toLowerCase();
    var ids = Object.keys(BADGE_KEYWORDS);
    for(var i=0;i<ids.length;i++){
      if(alreadyEarned.indexOf(ids[i])!==-1) continue;
      var words = BADGE_KEYWORDS[ids[i]];
      for(var j=0;j<words.length;j++){ if(low.indexOf(words[j])!==-1) return ids[i]; }
    }
    return null;
  }

  function judge(kind, pillar, tierId, text, person){
    var bracket = bracketFor(ageFromDob(person.dob)).label;
    var tiers = kind==='feat' ? FEAT_TIERS : DING_TIERS;
    var tier = tiers.filter(function(t){ return t.id===tierId; })[0] || tiers[0];
    var score = kind==='feat' ? randRange(tier.min, tier.max) : -randRange(-tier.max, -tier.min);
    var lines = kind==='feat' ? FEAT_LINES[tier.id] : DING_LINES[tier.id];
    var line = pick(lines).split('{name}').join(esc(person.name)).split('{pillar}').join(pillar);
    var clauseMap = kind==='feat' ? BRACKET_FEAT_CLAUSE : BRACKET_DING_CLAUSE;
    if(clauseMap[bracket]) line += clauseMap[bracket];
    var badge = null;
    if(kind==='feat' && (tier.id==='legacy' || tier.id==='strong')){
      badge = detectBadge(text, person.badges||[]);
    }
    return { score:score, verdict:line, tier:tier, badge:badge };
  }

  /* =========================================================
     REACTIONS
     ========================================================= */
  function reactionCounts(entry){
    var out = {};
    REACTIONS.forEach(function(e){ out[e] = (entry.reactions && entry.reactions[e]) ? entry.reactions[e].length : 0; });
    return out;
  }
  function hasReacted(entry, emoji){
    return !!(entry.reactions && entry.reactions[emoji] && entry.reactions[emoji].indexOf(identity.name)!==-1);
  }
  function toggleReaction(entryId, emoji){
    mutate(function(o){
      var e = o.entries.filter(function(x){ return x.id===entryId; })[0];
      if(!e) return;
      e.reactions = e.reactions || {};
      e.reactions[emoji] = e.reactions[emoji] || [];
      var idx = e.reactions[emoji].indexOf(identity.name);
      if(idx===-1){ e.reactions[emoji].push(identity.name); burstEmoji(emoji); }
      else { e.reactions[emoji].splice(idx,1); }
      maybeAwardPackAnchor(e);
    });
  }
  function totalReactions(entry){
    var t=0; if(!entry.reactions) return 0;
    Object.keys(entry.reactions).forEach(function(k){ t += entry.reactions[k].length; });
    return t;
  }
  function maybeAwardPackAnchor(entry){
    if(totalReactions(entry) < 5) return;
    var p = findPerson(entry.author);
    if(p && p.badges.indexOf('pack_anchor')===-1) p.badges.push('pack_anchor');
  }
  function burstEmoji(emoji){
    for(var i=0;i<6;i++){
      var s = document.createElement('span');
      s.textContent = emoji; s.className = 'burst-particle';
      s.style.left = (12 + Math.random()*76) + 'vw';
      s.style.fontSize = (18 + Math.random()*14) + 'px';
      s.style.animationDelay = (Math.random()*0.15)+'s';
      document.body.appendChild(s);
      (function(el){ setTimeout(function(){ el.remove(); }, 1300); })(s);
    }
  }
  function checkNewReactions(){
    if(!identity) return;
    var mine = shared.entries.filter(function(e){ return e.author===identity.name; });
    var freshCount = 0;
    mine.forEach(function(e){
      if(!e.reactions) return;
      Object.keys(e.reactions).forEach(function(emoji){
        e.reactions[emoji].forEach(function(who){ if(who!==identity.name) freshCount++; });
      });
    });
    if(freshCount > (window.__lastReactionTotal||0) && window.__lastReactionTotal!==undefined){
      showToast('The Circle reacted to your ledger.');
    }
    window.__lastReactionTotal = freshCount;
  }
  function showToast(msg){
    var t = document.createElement('div'); t.className='toast'; t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2600);
  }

  /* =========================================================
     OWNER UNLOCK (passphrase, hashed client-side)
     ========================================================= */
  function sha256Hex(text){
    var enc = new TextEncoder().encode(text);
    return crypto.subtle.digest('SHA-256', enc).then(function(buf){
      var arr = Array.from(new Uint8Array(buf));
      return arr.map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
    });
  }

    html += '<p class="verdict-text" style="font-size:15px">'+v.verdict+'</p>';
    if(v.badge){ var bd=BADGES.filter(function(b){return b.id===v.badge;})[0]; if(bd) html += '<p style="margin-top:10px;color:var(--gold);font-family:var(--font-d);font-size:13px">'+bd.emoji+' BADGE EARNED &mdash; '+bd.name+'</p>'; }
    html += '<button class="btn btn-gold" id="closeVerdict" style="margin-top:16px">Return to the Circle</button>';
    html += '</div></div>';
    return html;
  }

  /* =========================================================
     EVENTS
     ========================================================= */
  function bindEvents(){
    root.querySelectorAll('[data-go]').forEach(function(el){
      el.onclick = function(){ go(el.getAttribute('data-go')); };
    });
    root.querySelectorAll('[data-viewcard]').forEach(function(el){
      el.onclick = function(){ view='card'; showPersonCard(el.getAttribute('data-viewcard')); };
    });
    root.querySelectorAll('[data-quiz]').forEach(function(el){
      el.onclick = function(){
        var i = parseInt(el.getAttribute('data-quiz'),10);
        quizScore += QUIZ[quizStep].opts[i].v;
        quizStep++;
        renderOnboarding();
      };
    });
    var joinBtn = document.getElementById('joinBtn');
    if(joinBtn) joinBtn.onclick = function(){
      var name = (document.getElementById('onbName').value||'').trim();
      var dob = document.getElementById('onbDob').value;
      if(!name){ alert('The Council needs a name.'); return; }
      if(!dob){ alert('The Council needs a date of birth.'); return; }
      identity = { name:name };
      saveIdentity();
      mutate(function(o){
        if(!o.people.filter(function(p){return p.name===name;}).length){
          o.people.push({ name:name, dob:dob, score:clampScore(quizScore), badges:[], joinedAt:Date.now() });
        }
      });
      loadLastSeen();
      view='circle';
      render();
      startPolling();
    };

    root.querySelectorAll('[data-kind]').forEach(function(el){ el.onclick=function(){ subKind=el.getAttribute('data-kind'); subTierId=null; render(); }; });
    root.querySelectorAll('[data-pillar]').forEach(function(el){ el.onclick=function(){ subPillar=el.getAttribute('data-pillar'); render(); }; });
    root.querySelectorAll('[data-tier]').forEach(function(el){ el.onclick=function(){ subTierId=el.getAttribute('data-tier'); render(); }; });
    var targetSel = document.getElementById('targetSel'); if(targetSel) targetSel.onchange=function(){ subTarget=targetSel.value; };
    var subTextEl = document.getElementById('subText'); if(subTextEl) subTextEl.oninput=function(){ subText=subTextEl.value; };

    var ep = document.getElementById('editPortrait'); if(ep) ep.onclick = pickPortrait;
    var sp = document.getElementById('setPortrait'); if(sp) sp.onclick = pickPortrait;
    var dp = document.getElementById('dropPortrait'); if(dp) dp.onclick = function(){ if(confirm('Remove your portrait?')) removePortrait(); };

    var submitBtn = document.getElementById('submitBtn');
    if(submitBtn) submitBtn.onclick = handleSubmit;

    root.querySelectorAll('[data-openreact]').forEach(function(el){
      el.onclick = function(){ openReactPicker = (openReactPicker===el.getAttribute('data-openreact')) ? null : el.getAttribute('data-openreact'); render(); };
    });
    root.querySelectorAll('[data-react]').forEach(function(el){
      el.onclick = function(){ toggleReaction(el.getAttribute('data-react'), el.getAttribute('data-emoji')); openReactPicker=null; };
    });

    var copyLink = document.getElementById('copyLink');
    if(copyLink) copyLink.onclick = function(){
      var url = location.origin + location.pathname + '#g=' + GROUP;
      if(navigator.clipboard) navigator.clipboard.writeText(url).then(function(){ showToast('Link copied.'); });
    };
    var setOwner = document.getElementById('setOwner');
    if(setOwner) setOwner.onclick = function(){
      var pass = document.getElementById('ownerSetup').value;
      if(!pass){ return; }
      sha256Hex(pass).then(function(h){
        mutate(function(o){ o.ownerHash = h; });
        ownerUnlocked = true;
        try{ localStorage.setItem(OWNER_KEY,'1'); }catch(e){}
        render();
      });
    };
    var unlockOwner = document.getElementById('unlockOwner');
    if(unlockOwner) unlockOwner.onclick = function(){
      var pass = document.getElementById('ownerInput').value;
      sha256Hex(pass).then(function(h){
        if(h === shared.ownerHash){ ownerUnlocked=true; try{ localStorage.setItem(OWNER_KEY,'1'); }catch(e){} render(); }
        else { alert('Wrong passphrase.'); }
      });
    };
    var resetCircle = document.getElementById('resetCircle');
    if(resetCircle) resetCircle.onclick = function(){
      if(!confirm('This wipes every member, feat, and ding in this Circle. Continue?')) return;
      mutate(function(o){ o.people=[]; o.entries=[]; });
    };
    var closeVerdict = document.getElementById('closeVerdict');
    if(closeVerdict) closeVerdict.onclick = function(){ lastVerdict=null; subText=''; subPillar=null; subTierId=null; subTarget=''; go('circle'); };
  }

  function showPersonCard(name){
    root.innerHTML = renderCard(name) + renderTabbar();
    bindEvents();
  }

  function handleSubmit(){
    if(!subPillar){ alert('Pick a pillar.'); return; }
    if(!subTierId){ alert('Pick a weight.'); return; }
    if(subKind==='ding' && !subTarget){ alert('Pick who this is against.'); return; }
    if(!subText || !subText.trim()){ alert('Tell the Council what happened.'); return; }

    var authorName = identity.name;
    var targetName = subKind==='ding' ? subTarget : authorName;
    var person = findPerson(targetName);
    if(!person){ alert('That member isn\u2019t in the roster.'); return; }

    lastVerdict = { pending:true };
    render();

    setTimeout(function(){
      var result = judge(subKind, subPillar, subTierId, subText, person);
      var entry = {
        id:newId(), type:subKind, author:authorName, target: subKind==='ding'?subTarget:null,
        pillar:subPillar, text:subText.trim(), score:result.score,
        verdict:result.verdict, tierName:result.tier.name, tierColor:result.tier.color, tierBorder:result.tier.border,
        badge:result.badge, ts:Date.now(), reactions:{}
      };
      mutate(function(o){
        o.entries.push(entry);
        var p = o.people.filter(function(x){return x.name===targetName;})[0];
        if(p){
          p.score = clampScore(p.score + result.score);
          if(result.badge && p.badges.indexOf(result.badge)===-1) p.badges.push(result.badge);
          var br = bracketFor(ageFromDob(p.dob)).label;
          var topRank = ranksFor(br).slice(-1)[0];
          if(p.score >= topRank.minScore && p.badges.indexOf('pillar')===-1) p.badges.push('pillar');
        }
      });
      lastVerdict = result;
      render();
    }, 900);
  }

  /* =========================================================
     BOOT
     ========================================================= */
  function startPolling(){ if(!pollTimer) pollTimer = setInterval(poll, POLL_INTERVAL); }

  function boot(){
    identity = loadIdentity();
    loadLastSeen();
    try { ownerUnlocked = localStorage.getItem(OWNER_KEY) === '1'; } catch(e){}
    fetchShared().then(function(fresh){
      shared = fresh;
      render();
      if(identity) startPolling();
    }).catch(function(){
      statusMsg = 'Offline — showing local data only';
      render();
      if(identity) startPolling();
    });
    render();
  }
  boot();
})();
</script>
</body>
</html>
